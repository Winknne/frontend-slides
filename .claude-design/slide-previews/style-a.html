<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A Preview — Dark Botanical</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
/* === VIEWPORT BASE === */
html, body { height: 100%; overflow-x: hidden; margin: 0; padding: 0; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
.slide { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
:root {
  --title-size: clamp(1.5rem, 5vw, 4rem);
  --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
  --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
  --small-size: clamp(0.65rem, 1vw, 0.875rem);
  --slide-padding: clamp(1rem, 4vw, 4rem);
  --content-gap: clamp(0.5rem, 2vw, 2rem);
  --element-gap: clamp(0.25rem, 1vw, 1rem);

  /* Dark Botanical palette */
  --bg-primary: #0f0f0f;
  --text-primary: #e8e4df;
  --text-secondary: #9a9590;
  --accent-warm: #d4a574;
  --accent-pink: #e8b4b8;
  --accent-gold: #c9b896;
}
@media (max-height: 700px) { :root { --slide-padding: clamp(0.75rem, 3vw, 2rem); --title-size: clamp(1.25rem, 4.5vw, 2.5rem); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }

/* === DARK BOTANICAL THEME === */
body { background: var(--bg-primary); font-family: 'IBM Plex Sans', sans-serif; color: var(--text-primary); }

/* Abstract soft gradient orbs */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0;
  animation: orb-fade 1.2s ease forwards;
}
.orb-1 { width: clamp(200px, 40vw, 500px); height: clamp(200px, 40vw, 500px); background: radial-gradient(circle, #d4a57430, transparent 70%); top: -10%; right: -5%; animation-delay: 0.2s; }
.orb-2 { width: clamp(150px, 30vw, 380px); height: clamp(150px, 30vw, 380px); background: radial-gradient(circle, #e8b4b820, transparent 70%); bottom: 5%; left: -8%; animation-delay: 0.5s; }
.orb-3 { width: clamp(100px, 20vw, 250px); height: clamp(100px, 20vw, 250px); background: radial-gradient(circle, #c9b89618, transparent 70%); top: 40%; right: 20%; animation-delay: 0.7s; }

/* Thin vertical accent line */
.accent-line {
  position: absolute;
  left: clamp(1.5rem, 4vw, 5rem);
  top: 15%;
  height: 60%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--accent-warm), transparent);
  opacity: 0;
  animation: line-appear 1s ease 0.4s forwards;
}

/* Main content */
.slide-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--slide-padding);
  padding-left: clamp(3rem, 8vw, 8rem);
  max-height: 100%;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.label {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: var(--small-size);
  font-weight: 300;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent-warm);
  opacity: 0;
  transform: translateY(8px);
  animation: reveal 0.7s ease 0.6s forwards;
  margin-bottom: clamp(0.75rem, 2vh, 1.5rem);
}

.title {
  font-family: 'Cormorant', serif;
  font-size: clamp(2.5rem, 6.5vw, 5.5rem);
  font-weight: 600;
  line-height: 1.05;
  color: var(--text-primary);
  opacity: 0;
  transform: translateY(12px);
  animation: reveal 0.8s ease 0.85s forwards;
  margin: 0 0 clamp(0.5rem, 1.5vh, 1rem);
}

.title em {
  font-style: italic;
  color: var(--accent-gold);
}

.subtitle {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: clamp(0.85rem, 1.8vw, 1.2rem);
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.6;
  opacity: 0;
  transform: translateY(8px);
  animation: reveal 0.7s ease 1.1s forwards;
  max-width: min(55ch, 80vw);
  margin-bottom: clamp(1.5rem, 4vh, 3rem);
}

.divider {
  width: clamp(40px, 6vw, 80px);
  height: 1px;
  background: var(--accent-warm);
  opacity: 0;
  animation: divider-grow 0.6s ease 1.3s forwards;
  margin-bottom: clamp(1rem, 2.5vh, 2rem);
}

.meta {
  display: flex;
  gap: clamp(1rem, 3vw, 3rem);
  opacity: 0;
  transform: translateY(6px);
  animation: reveal 0.6s ease 1.5s forwards;
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 0.2em;
}

.meta-label {
  font-size: clamp(0.6rem, 0.9vw, 0.75rem);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-secondary);
  font-weight: 300;
}

.meta-value {
  font-family: 'Cormorant', serif;
  font-size: clamp(0.85rem, 1.4vw, 1.1rem);
  color: var(--accent-pink);
  font-style: italic;
}

/* Bottom right: style label */
.style-tag {
  position: absolute;
  bottom: clamp(1rem, 2.5vh, 2rem);
  right: clamp(1rem, 3vw, 3rem);
  font-size: clamp(0.55rem, 0.8vw, 0.7rem);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
  opacity: 0.5;
}

@keyframes orb-fade { to { opacity: 1; } }
@keyframes reveal { to { opacity: 1; transform: translateY(0); } }
@keyframes line-appear { to { opacity: 1; } }
@keyframes divider-grow { from { width: 0; opacity: 0; } to { width: clamp(40px, 6vw, 80px); opacity: 1; } }
</style>
</head>
<body>
<section class="slide">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="accent-line"></div>
  <div class="slide-content">
    <p class="label">Conference Presentation</p>
    <h1 class="title">Emotion <em>Arcs</em><br>in Academic<br>Writing</h1>
    <p class="subtitle">How affect unfolds across IMRaD sections in medical research articles — a VAD dimensional analysis of 3,600 texts</p>
    <div class="divider"></div>
    <div class="meta">
      <div class="meta-item">
        <span class="meta-label">Presenter</span>
        <span class="meta-value">Your Name</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Corpus</span>
        <span class="meta-value">13.6M tokens</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Year</span>
        <span class="meta-value">2026</span>
      </div>
    </div>
  </div>
  <div class="style-tag">Style A — Dark Botanical</div>
</section>
</body>
</html>
